server:
  port: ${API_PORT:8080}

spring:
  application:
    name: document-digitization-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/document_digitization}
    username: ${SPRING_DATASOURCE_USERNAME:documents}
    password: ${SPRING_DATASOURCE_PASSWORD:local-development-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-N/A}]"

app:
  auth:
    jwt-secret: ${APP_JWT_SECRET}
  i18n:
    default-locale: en
    supported-locales: en,fr
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    region: us-east-1
    bucket: document-images
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:local-development-only}
